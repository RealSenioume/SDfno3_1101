[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolping"
version = "0.3.3"
description = "A League of Legends style ping wheel for the Windows desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyQt5==5.15.11", "pynput==1.8.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
lolping = "lolping.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# Editor/static-analysis configuration. The tests import modules from `src`
# (the package) and from `tools` (standalone scripts) after adding them to
# sys.path at run time; Pyright/Pylance cannot follow that, so the same two
# folders are declared here. Without this, Pylance reports
# "Import could not be resolved" for imports that work perfectly at run time.
[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["src", "tools"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
